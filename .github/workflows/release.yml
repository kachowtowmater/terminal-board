name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            tool: cargo
          - target: x86_64-apple-darwin
            os: macos-14
            tool: cargo
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            tool: cross
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            tool: cross
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Tag matches Cargo.toml
        shell: bash
        run: |
          want="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$want" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $want" >&2
            exit 1
          fi
      - name: Install cross
        if: matrix.tool == 'cross'
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build
        shell: bash
        run: ${{ matrix.tool }} build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          tar -czf "dist/tb-$TARGET.tar.gz" -C "target/$TARGET/release" tb
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum "tb-$TARGET.tar.gz"; else shasum -a 256 "tb-$TARGET.tar.gz"; fi >"tb-$TARGET.tar.gz.sha256"
          cat "tb-$TARGET.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: tb-${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## $version" '
            $0 == v || index($0, v " ") == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md >notes.md
          if [ ! -s notes.md ]; then echo "no CHANGELOG section for $version" >&2; exit 1; fi
          cat notes.md
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Terminal Board $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag
