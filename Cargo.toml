[package]
name = "terminal-board"
version = "1.0.0"
edition = "2021"
description = "Terminal Board (tb): a simple terminal task board shared by people and AI agents"
license = "MIT"

[[bin]]
name = "tb"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
